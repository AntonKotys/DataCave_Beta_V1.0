spring.application.name=DataCave_Beta
server.port=8080
spring.docker.compose.enabled=false

# Where prototype state + uploaded files are stored (relative to working dir)
datacave.data-dir=data

# Allow photo/audio uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Minimum AI relevance score (0-100) for a photo submission to be accepted
datacave.quality.min-relevance-score=60

# Tolerate partial JSON bodies (missing primitives default to 0) and unknown fields
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.deserialization.fail-on-unknown-properties=false
